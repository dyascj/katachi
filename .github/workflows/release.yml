name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal app
        run: |
          TARGET=aarch64-apple-darwin scripts/macos-app.sh
          cargo build --release --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/katachi target/x86_64-apple-darwin/release/katachi \
            -output target/Katachi.app/Contents/MacOS/katachi
          codesign --force --deep --sign - target/Katachi.app
          # Two full builds nearly fill the runner's disk; keep only the app before packaging.
          mkdir -p "$RUNNER_TEMP/stage" && cp -R target/Katachi.app "$RUNNER_TEMP/stage/"
          rm -rf target
          # hdiutil can underestimate the volume size for -srcfolder; size it from the app plus headroom.
          size=$(( $(du -sm "$RUNNER_TEMP/stage/Katachi.app" | cut -f1) + 32 ))
          hdiutil create -volname Katachi -srcfolder "$RUNNER_TEMP/stage/Katachi.app" -size "${size}m" -ov -format UDZO Katachi-macos.dmg
          # What the in-app updater downloads.
          tar -czf Katachi-macos.app.tar.gz -C "$RUNNER_TEMP/stage" Katachi.app
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Katachi-macos.dmg
            Katachi-macos.app.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/katachi.exe -DestinationPath Katachi-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Katachi-windows.zip

  # Built on AlmaLinux 8 (glibc 2.28) so one binary runs on RHEL 8+, Debian 11+, Ubuntu 20.04+,
  # Fedora, Arch, and the rest. Everything graphical is loaded at runtime, so nothing else links.
  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build on glibc 2.28
        run: |
          docker run --rm -v "$PWD":/src -w /src almalinux:8 bash -euc '
            dnf install -y -q gcc gcc-c++ make perl
            curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release
            chown -R '"$(id -u):$(id -g)"' target'
      - name: Check the glibc floor
        run: |
          need=$(objdump -T target/release/katachi | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "Needs $need"
          [ "$(printf '%s\nGLIBC_2.28\n' "$need" | sort -V | tail -1)" = GLIBC_2.28 ] || { echo "::error::binary needs $need"; exit 1; }
      - name: Runs on old and new distributions
        run: |
          imgs="debian:11 ubuntu:20.04 rockylinux:8 fedora:latest opensuse/leap:15.6"
          # Arch publishes x86_64 images only.
          [ "${{ matrix.arch }}" = x86_64 ] && imgs="$imgs archlinux:latest"
          for img in $imgs; do
            docker run --rm -v "$PWD/target/release:/k:ro" "$img" /k/katachi --version
          done
      - name: Starts and draws a window
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1 libxkbcommon-x11-0
          KATACHI_NO_UPDATE=1 KATACHI_SCREENSHOT="$PWD/shot.png" timeout 120 xvfb-run -a -s "-screen 0 1440x900x24" target/release/katachi
          test -s shot.png
      - name: Package
        run: |
          sudo apt-get install -y -q rpm
          scripts/linux-package.sh target/release/katachi ${{ matrix.arch }} dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Sign every asset so the in-app updater can check downloads against the key built into Katachi.
  sign:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign release assets
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D dist
          printf '%s\n' "$KEY" > key
          for f in dist/*; do
            case "$f" in *.minisig) continue ;; esac
            minisign -S -s key -m "$f" -t "Katachi $GITHUB_REF_NAME $(basename "$f")" </dev/null
          done
          rm key
          gh release upload "$GITHUB_REF_NAME" dist/*.minisig -R "$GITHUB_REPOSITORY" --clobber
      # Hand-written notes live in release-notes/<tag>.md. Signing comes first, so updates still
      # work if this fails, but a release without notes fails loudly here.
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/$GITHUB_REF_NAME.md"
          if [ ! -f "$notes" ]; then echo "::error::Write $notes before tagging"; exit 1; fi
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Katachi ${GITHUB_REF_NAME#v}" --notes-file "$notes"

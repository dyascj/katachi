name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS and Windows: the release builds there too, and every platform must build for signing.
  other:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A software GPU: a few tests render, and the launch check draws a real window.
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - run: cargo test
      - run: cargo build --release
      - name: Starts and draws a window on Linux
        run: |
          KATACHI_NO_UPDATE=1 KATACHI_SCREENSHOT="$PWD/shot.png" timeout 120 xvfb-run -a -s "-screen 0 1440x900x24" target/release/katachi
          test -s shot.png

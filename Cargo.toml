[package]
name = "katachi"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Figma-style design tool written in Rust"

[dependencies]
eframe = "0.35.0"
egui = { version = "0.35.0", features = ["serde"] }
lyon = "1.0.19"
resvg = "0.48.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["eframe", "wgpu"] }
